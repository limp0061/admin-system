<div th:fragment="viewController" class="hidden gap-1 md:flex">
  <div class="relative inline-block">
    <button
      class="btn ignore-close dark:text-slate-200 dark:hover:bg-[#2a2a2a]"
      data-action="btnDropDown"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 13.5V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m12-3V3.75m0 9.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 3.75V16.5m-6-9V3.75m0 3.75a1.5 1.5 0 0 1 0 3m0-3a1.5 1.5 0 0 0 0 3m0 9.75V10.5"
        />
      </svg>
    </button>
    <div
      class="btn-dropDown ignore-close absolute right-0 top-full z-50 mt-1 hidden rounded border border-gray-300 bg-white shadow-md"
    >
      <ul class="flex flex-col text-xs">
        <li
          class="group relative flex w-full items-center justify-center hover:cursor-pointer hover:bg-gray-100"
        >
          <span
            class="whitespace-nowrap p-3 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            data-action="btnDropDown"
          >
            목록 크기
          </span>
          <div
            class="btn-dropDown absolute -top-0.5 right-full mr-0.5 hidden min-w-[50px] flex-col rounded border border-gray-300 bg-white shadow-md"
          >
            <a
              href="javascript:void(0)"
              onclick="changeSize(10)"
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            >
              10개
            </a>
            <a
              href="javascript:void(0)"
              onclick="changeSize(20)"
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            >
              20개
            </a>
            <a
              href="javascript:void(0)"
              onclick="changeSize(30)"
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            >
              30개
            </a>
            <a
              href="javascript:void(0)"
              onclick="changeSize(40)"
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            >
              40개
            </a>
          </div>
        </li>
        <li
          class="group relative flex w-full items-center justify-center hover:cursor-pointer hover:bg-gray-100"
        >
          <span
            class="whitespace-nowrap p-3 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
            data-action="btnDropDown"
          >
            폰트 크기
          </span>
          <div
            class="btn-dropDown absolute -top-0.5 right-full mr-0.5 hidden min-w-[50px] flex-col rounded border border-gray-300 bg-white shadow-md"
          >
            <button
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
              data-font-size="12px"
            >
              12px
            </button>
            <button
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
              data-font-size="14px"
            >
              14px
            </button>
            <button
              class="whitespace-nowrap p-3 text-center hover:bg-gray-100 dark:bg-[#2a2a2a] dark:hover:bg-[#333333]"
              data-font-size="16px"
            >
              16px
            </button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
