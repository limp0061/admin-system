<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 |</title>
  </head>
  <body class="min-h-screen">
    <div class="flex min-h-screen">
      <nav th:replace="~{fragments/nav :: nav}"></nav>
      <div class="flex flex-1 flex-col">
        <header th:replace="~{fragments/header :: header}"></header>
        <main class="vt-main flex flex-1 flex-col">
          <div class="flex flex-1 flex-col items-center justify-center">
            <div class="text-center">
              <h2
                class="mb-4 text-2xl font-semibold tracking-tight text-slate-700"
                th:text="${title}"
              ></h2>
              <p
                class="text-lg font-medium text-slate-500"
                th:text="${message}"
              ></p>
              <div class="mt-10">
                <a
                  href="/dashboard"
                  class="inline-flex items-center rounded-lg border border-transparent bg-slate-800 px-8 py-3 text-base font-semibold text-white shadow-md transition-all duration-200 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2"
                >
                  대시보드로 이동
                </a>
              </div>
            </div>
          </div>
        </main>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
      </div>
    </div>
    <script type="module" th:src="@{/js/menu/menu.js}"></script>
    <script type="module" th:src="@{/js/common/index.js}"></script>
  </body>
</html>
