<div th:fragment="noticeHeader" class="flex flex-col-reverse lg:flex-row w-full lg:items-end lg:justify-between">
  <div th:with="currentType=${params.type ?: 'ALL'}">
    <input type="hidden" id="tabType" th:value="${currentType}" />
    <ul class="flex text-xs sm:text-sm font-medium">
      <li
        th:each="t : ${#strings.arraySplit('ALL,NORMAL,SYSTEM', ',')}"
        class="whitespace-nowrap border-l border-t pr-1 last:pr-0 dark:border-zinc-800"
      >
        <a
          href="javascript:void(0)"
          th:text="${t == 'ALL' ? '전체' : (t == 'NORMAL' ? '일반' : '시스템')}"
          th:classappend="${(param.type == null && t == 'ALL') || currentType == t} ? 'text-blue-600 border-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent'"
          data-action="toggleTab"
          th:data-tab="${t}"
          class="inline-block rounded-t-lg border-b-2 p-4"
        ></a>
      </li>
    </ul>
  </div>
  <div
    class="flex flex-col w-full md:flex-row md:items-center gap-1 pb-3 md:w-auto"
    th:with="selectedFilter=${params?.filter != null ? params.filter  : null}"
  >
    <div class="flex w-full gap-1 md:w-auto">
      <input
        type="hidden"
        name="noticeType"
        id="noticeType"
        th:value="${selectedFilter != null ? selectedFilter.name() : 'ALL'}"
      />
      <button
        class="form-input ignore-close flex w-24 items-center justify-between text-left hover:bg-gray-50 focus:border-gray-400 focus:ring-0 dark:hover:bg-zinc-800/30"
        data-action="toggleSelect"
        id="noticeFilter-btn"
        type="button"
      >
      <span class="whitespace-nowrap"
            th:text="${selectedFilter != null ? selectedFilter.label : '전체'}"
      ></span>
        <svg
          class="ml-2 h-3 w-3 transform opacity-50 transition-transform"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>
      <ul class="data-template z-100">
        <li
          class="select-li text-left"
          th:each="filter : ${noticeFilter}"
          th:data-value="${filter.name()}"
          th:text="${filter.label}"
          data-action="noticeFilter"
        ></li>
      </ul>
      <div class="search-container flex w-full md:w-64">
        <form class="relative w-full">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="absolute left-3 top-1/2 h-3 w-3 -translate-y-1/2 text-gray-400"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
          <input
            type="text"
            name="keyword"
            placeholder="공지 제목"
            th:value="${params.keyword}"
            class="search-input h-9 w-full rounded-md border border-gray-300 py-3 pl-10 pr-4 text-xs font-medium focus:outline-none focus:ring-1 focus:ring-gray-300"
            autocomplete="off"
          />
          <button
            type="button"
            class="clear-btn z-5 absolute right-2 top-1/2 -translate-y-1/2"
            th:classappend="${!#strings.isEmpty(params.keyword)} ? '': 'hidden'"
            data-action="clearInput"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-3"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </button>
        </form>
      </div>
    </div>
    <div class="md:ml-1 flex gap-1">
      <button class="btn btn-primary flex-1 md:flex-none md:w-24 p-4 sm:px-4 justify-center"
              data-action="openNoticeModal">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 4.5v15m7.5-7.5h-15"
          />
        </svg>
        <span class="text-xs sm:text-sm">추가</span>
      </button>
      <button class="btn btn-danger flex-1 md:flex-none md:w-24 p-4 sm:px-4 justify-center"
              data-action="openDeleteModal">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
          />
        </svg>
        <span class="text-xs sm:text-sm">삭제</span>
      </button>
      <div th:replace="~{components/view-controller::viewController}"></div>
    </div>
  </div>
</div>
