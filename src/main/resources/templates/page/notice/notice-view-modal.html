<div
  th:fragment="content"
  id="modal-form"
  class="modal-form z-10 max-h-[70vh] w-[500px] overflow-hidden bg-gray-50 text-sm font-normal shadow-xl"
>
  <div class="flex items-center justify-between border-b border-gray-300 pb-3">
    <span class="text-xs sm:text-xl font-semibold">전체 공지(최근 30개)</span>
    <button
      onClick="closeModal()"
      class="text-gray-400 transition-colors hover:text-gray-600 dark:hover:text-zinc-300"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18 18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
  <div
    class="flex flex-1 flex-col gap-3 overflow-y-auto border-b border-gray-300"
  >
    <div
      th:each="item:${list}"
      th:data-id="${item.id}"
      th:onclick="|handleNotificationClick(event, null, '/notices/${item.id}', null)|"
      class="group cursor-pointer rounded-xl bg-white p-3 transition-all hover:bg-blue-50/30 hover:shadow-md dark:bg-zinc-800/40 dark:hover:bg-zinc-800/30"
    >
      <div class="flex items-center gap-3">
        <span
          class="shrink-0 rounded-md px-2 py-0.5 text-center text-[9px] font-bold"
          th:classappend="${item.type.name() == 'SYSTEM' ? 'bg-blue-50 text-blue-900 dark:bg-blue-950 dark:text-blue-50'
                       : 'bg-gray-100 text-gray-600 dark:bg-zinc-700 dark:text-slate-50'}"
          th:text="${item.type.label}"
        ></span>

        <span
          class="flex-1 truncate text-[13px] font-medium text-gray-700 group-hover:text-blue-900 dark:text-slate-200 dark:group-hover:text-slate-50"
          th:text="${item.title}"
        ></span>

        <span
          class="shrink-0 whitespace-nowrap text-[10px] text-gray-300"
          th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd')}"
        ></span>
      </div>
    </div>
  </div>
  <div class="mt-1 flex w-full justify-end gap-2">
    <button
      type="button"
      class="btn bg-gray-100 px-4 dark:bg-zinc-300 dark:hover:bg-zinc-400"
      onClick="closeModal()"
    >
      닫기
    </button>
  </div>

  <ul id="common-select-ul" class="select-ul hidden"></ul>
</div>
