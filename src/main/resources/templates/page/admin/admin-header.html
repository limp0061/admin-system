<div
  th:fragment="adminHeader"
  id="page-header"
  class="flex items-center gap-2 sm:px-5 px-3 py-3"
>
  <div class="mr-2 hidden min-w-[60px] gap-1 text-sm font-medium md:flex whitespace-nowrap">
    <span>관리자</span>
    <span th:text="|(${list.totalCount ?: 0})|"></span>
  </div>
  <div class="btn-list flex flex-1 items-center gap-1.5">
    <button
      class="btn btn-primary hover:cursor-pointer flex-1 sm:flex-none p-4 sm:px-4 justify-center"
      data-action="openAdminModal"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 4.5v15m7.5-7.5h-15"
        />
      </svg>
      <span>추가</span>
    </button>
    <button
      class="btn btn-danger hover:cursor-pointer flex-1 sm:flex-none p-4 sm:px-4 justify-center"
      data-action="openDeleteModal"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-4"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"
        />
      </svg>
      <span>삭제</span>
    </button>
  </div>
  <div class="flex-col justify-end">
    <div th:replace="~{components/view-controller::viewController}"></div>
  </div>
</div>
