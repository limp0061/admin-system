<div
  th:fragment="content"
  class="modal-form z-10 max-h-[80vh] w-[450px] rounded-2xl bg-white p-6 shadow-xl"
>
  <div class="flex items-center justify-between border-b pb-4">
    <span class="text-xl font-bold text-slate-800 dark:text-slate-50">
      관리자 수정
    </span>
    <button
      onClick="closeModal()"
      class="text-gray-400 transition-colors hover:text-gray-600 dark:hover:text-zinc-300"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6 18 18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>

  <form id="admin-form" class="flex flex-1 flex-col overflow-y-auto">
    <div class="flex flex-1 flex-col gap-4">
      <div
        id="selected-user-card"
        class="relative flex w-full flex-col gap-1.5 rounded-lg border-2 border-slate-800 bg-white p-4 shadow-sm dark:border-zinc-700 dark:bg-zinc-900"
      >
        <input type="hidden" name="id" th:value="${admin.id}" />
        <div class="flex items-baseline gap-2">
          <span
            class="text-base font-bold text-slate-900 dark:text-slate-200"
            th:text="${admin.name}"
          ></span>
          <span
            class="text-xs font-medium text-slate-500 dark:text-slate-400"
            th:text="${admin.deptName}"
          ></span>
        </div>
        <span
          class="text-sm text-gray-500 dark:text-slate-400"
          th:text="${admin.emailId}"
        ></span>
        <div class="absolute right-3 top-3 text-slate-800 dark:text-slate-50">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-5"
          >
            <path
              fill-rule="evenodd"
              d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm13.36-1.814a.75.75 0 1 0-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 0 0-1.06 1.06l2.25 2.25a.75.75 0 0 0 1.14-.094l3.75-5.25Z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
      </div>

      <div class="flex gap-1 dark:border-zinc-700">
        <input type="hidden" id="role" name="role" th:value="${admin.roleId}" />
        <button
          type="button"
          id="role-btn"
          class="ignore-close flex h-10 w-full items-center justify-between rounded-md border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm transition-all hover:border-slate-400 dark:border-zinc-700 dark:bg-zinc-800"
          data-action="toggleSelect"
          th:text="${admin.roleName}"
        ></button>
        <ul class="data-template">
          <li
            class="select-li"
            th:each="role : ${roles}"
            th:data-value="${role.id()}"
            th:text="${role.roleName}"
          ></li>
        </ul>
      </div>

      <div
        class="flex flex-col gap-3 rounded-xl bg-gray-50 py-4 dark:bg-zinc-800/40"
      >
        <div class="flex items-center gap-2 p-2">
          <input
            type="text"
            id="ip-input"
            class="h-10 flex-1 rounded-lg border border-gray-200 bg-white px-3 text-sm focus:border-slate-500 focus:outline-none dark:border-zinc-700 dark:bg-zinc-800"
            placeholder="접근 허용 IP (예: 192.168.1.1)"
            autocomplete="off"
          />
          <button
            type="button"
            class="h-10 shrink-0 rounded-lg bg-slate-700 px-4 text-sm font-semibold text-white transition-colors hover:bg-slate-800 dark:bg-blue-800 dark:hover:bg-blue-950"
            data-action="addIps"
          >
            추가
          </button>
        </div>

        <div id="ip-list" class="flex flex-wrap gap-2 p-2">
          <div th:each="ip : ${admin.allowedIps}">
            <div
              class="flex w-fit items-center gap-1.5 rounded-md border border-gray-200 bg-white px-2.5 py-1.5 text-slate-700 shadow-sm dark:border-zinc-700 dark:bg-zinc-800 dark:text-slate-50"
            >
              <span class="ip text-xs font-semibold" th:text="${ip}"></span>
              <button
                type="button"
                class="text-gray-400 transition-colors hover:text-red-500"
                onclick="this.parentElement.remove()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="size-3.5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2.5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4 flex justify-end gap-2 border-t pt-4 dark:border-zinc-700">
      <button type="button" class="btn btn-primary" data-action="updateAdmin">
        수정
      </button>
      <button
        type="button"
        onClick="closeModal()"
        class="btn bg-gray-100 px-4 dark:bg-zinc-300 dark:hover:bg-zinc-400"
      >
        닫기
      </button>
    </div>
  </form>
</div>
