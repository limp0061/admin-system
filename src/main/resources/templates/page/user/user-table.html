<div
  th:fragment="pageTable(pageType)"
  id="page-table"
  class="w-full flex-1 px-5"
>
  <table class="table w-full">
    <thead class="border border-b-2">
    <tr>
      <th class="w-12 py-3 !text-center">
        <input
          type="checkbox"
          data-action="checkToggle"
          class="check-all size-3 cursor-pointer"
        />
      </th>
      <th class="w-[20%] md:w-[15%]">이름</th>
      <th class="min-w-0 flex-1">이메일</th>
      <th class="w-[20%] md:w-[15%] text-center">사번</th>
      <th class="w-[15%] hidden md:table-cell">부서</th>
      <th class="w-[15%]">
        <div
          class="flex items-center justify-between gap-2 whitespace-nowrap"
        >
          <span>계정 상태</span>
          <div th:if="${pageType.name() =='LIST'}" class="relative">
            <button
              type="button"
              class="filter-btn ignore-close rounded p-1 hover:bg-gray-100"
              data-action="btnDropDown"
              data-key="userStatus"
              aria-label="정렬"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-4"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"
                />
              </svg>
            </button>
            <div
              class="btn-dropDown absolute left-1/2 top-full z-50 mt-1 hidden -translate-x-1/2 flex-col whitespace-nowrap rounded border border-gray-300 shadow-md"
            >
              <a
                onClick="filterStatus('')"
                class="cursor-pointer px-4 py-2 transition-colors hover:bg-gray-100 dark:hover:bg-zinc-700"
              >
                전체
              </a>
              <a
                onClick="filterStatus('ACTIVE')"
                class="cursor-pointer px-4 py-2 text-emerald-600 hover:bg-emerald-50 dark:text-emerald-400 dark:hover:bg-emerald-900/30"
              >
                정상
              </a>
              <a
                onClick="filterStatus('BLOCKED')"
                class="cursor-pointer px-4 py-2 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/30"
              >
                중지
              </a>
              <a
                onClick="filterStatus('LOCKED')"
                class="cursor-pointer px-4 py-2 hover:bg-gray-50 dark:hover:bg-zinc-700"
              >
                잠금
              </a>
            </div>
          </div>
        </div>
      </th>
      <th class="w-[20%] hidden md:table-cell">
        <div class="flex items-center justify-between gap-2">
            <span
              class="dark:text-zinc-400"
              th:text="${pageType.name() == 'LIST' ? '수정 일시' : (pageType.name() == 'APPROVAL' ? '생성 일시' : '삭제 일시')}"
            ></span>
          <button
            type="button"
            class="sort-btn rounded p-1 text-gray-500 transition-colors hover:bg-gray-200 dark:text-zinc-500 dark:hover:bg-zinc-700"
            data-action="sort"
            th:data-sort="${pageType.name() == 'LIST' ? 'updatedAt' : (pageType.name() == 'APPROVAL' ? 'createdAt' : 'deletedAt')}"
            th:data-order="${list.direction}"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="h-4 w-4 transform transition-transform duration-200"
              th:classappend="${(list.sortBy == 'updatedAt' or list.sortBy == 'createdAt' or list.sortBy == 'deletedAt') and list.direction == 'ASC'} ? 'rotate-180' : ''"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </button>
        </div>
      </th>
    </tr>
    </thead>
    <tbody class="divide-y dark:divide-zinc-800">
    <tr th:if="${#lists.isEmpty(list.content)}">
      <td colspan="7" class="py-16 text-center text-gray-400">
        등록된 사용자가 없습니다.
      </td>
    </tr>

    <tr
      th:unless="${#lists.isEmpty(list.content)}"
      th:each="item : ${list.content}"
      th:data-id="${item.id}"
      class="hover:cursor-pointer hover:bg-gray-50"
      data-action="clickRow"
    >
      <td class="text-center align-middle">
        <input
          type="checkbox"
          class="check-box size-3"
          th:value="${item.id}"
        />
      </td>
      <td th:text="${item.name}"></td>
      <td
        class="max-w-[200px] truncate"
        th:text="${item.emailId}"
        th:title="${item.emailId}"
      ></td>
      <td th:text="${item.userCode}"></td>
      <td class="hidden md:table-cell"
          th:data-dept-id="${item.deptId}" th:text="${item.deptName}"></td>
      <td th:text="${item.userStatus.label}"></td>
      <td class="hidden md:table-cell"
          th:text="${#temporals.format(item.updatedAt, 'yyyy-MM-dd HH:mm')} "
      ></td>
    </tr>
    </tbody>
  </table>
</div>
