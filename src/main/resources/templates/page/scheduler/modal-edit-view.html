<div th:fragment="content" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="modal-form w-full max-w-[500px] overflow-hidden rounded-xl bg-white shadow-2xl dark:bg-zinc-900">

    <div class="flex items-center justify-between border-b border-gray-100 px-3 py-4 dark:border-zinc-800">
      <div class="flex flex-col">
        <span class="text-xs font-bold text-blue-600 dark:text-blue-400">Scheduler Detail</span>
        <h3 class="text-sm md:text-xl font-bold uppercase tracking-wider text-gray-800 dark:text-zinc-100"
            th:text="${detail.name}"></h3>
      </div>
      <button onClick="closeModal()"
              class="rounded-full p-2 text-gray-400 transition-all hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-zinc-800">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
             class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="p-3">
      <div id="detail-view" class="flex flex-col gap-6">
        <div class="flex flex-col gap-2 rounded-xl bg-blue-50/50 p-4 dark:bg-blue-900/10">
          <label class="text-xs font-semibold text-blue-600 dark:text-blue-400">반복 주기 (Cron)</label>
          <div class="flex items-center gap-2">
            <code class="text-lg font-bold text-blue-900 dark:text-blue-200" th:text="${detail.cron}">0 0 3 * * *</code>
            <span
              class="rounded bg-blue-100 px-2 py-1 text-[10px] font-bold text-blue-700 dark:bg-blue-800 dark:text-blue-100"
              th:text="${detail.cronDescription}"></span>
          </div>
        </div>

        <div class="grid flex-1 grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-3 px-3">
            <label class="text-xs font-medium text-gray-500 dark:text-zinc-500">마지막 실행</label>
            <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold text-gray-700 dark:text-zinc-300">
              <svg class="size-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" />
              </svg>
              <span th:text="${detail.lastRunAt}">-</span>
            </div>
          </div>
          <div class="flex flex-col gap-3 md:border-l px-3 md:pl-4 dark:border-zinc-800">
            <label class="text-xs font-medium text-gray-500 dark:text-zinc-500">예정 시간</label>
            <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold text-blue-600 dark:text-blue-400">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span th:text="${detail.nextRunAt}">-</span>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2 rounded-xl bg-blue-50/50 p-4 dark:bg-blue-900/10">
          <p class="text-xs font-semibold text-gray-400">설명</p>
          <p class="text-sm leading-relaxed text-gray-700 dark:text-zinc-300"
             th:text="${detail.description ?: '설명이 없습니다.'}"></p>
        </div>

        <div class="flex items-center justify-between rounded-xl bg-blue-50/50 p-4 dark:bg-blue-900/10">
          <p class="text-xs font-semibold text-gray-400">현재 상태</p>
          <span th:text="${detail.enabled ? '사용 중' : '중지됨'}"
                th:classappend="${detail.enabled ? 'text-blue-500' : 'text-red-500'}"
                class="text-xs sm:text-sm font-bold"></span>
        </div>

        <div class="mt-4 flex items-center justify-end gap-3 border-t pt-6 dark:border-zinc-800">
          <button type="button"
                  class="flex items-center gap-2 rounded-lg bg-blue-600 px-6 py-2.5 text-xs sm:text-sm font-bold text-white transition-all hover:bg-blue-700"
                  data-mode="edit" data-action="toggleView">
            <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            수정하기
          </button>
          <button type="button"
                  class="rounded-lg bg-gray-100 px-5 py-2.5 text-sm font-bold text-gray-700 transition-all hover:bg-gray-200 dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700"
                  onClick="closeModal()">
            닫기
          </button>
        </div>
      </div>

      <div id="edit-view">
        <form id="scheduler-edit-form" class="flex-col gap-6 hidden">
          <input type="hidden" name="id" th:value="${detail.id}" />

          <div class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
              <label for="edit-cron"
                     class="px-1 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-zinc-500">
                반복 주기 (Cron Expression)
              </label>
              <input id="edit-cron" name="cron" type="text" th:value="${detail.cron}"
                     class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 font-mono text-sm font-bold text-blue-700 outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-800 dark:bg-zinc-800 dark:text-blue-400"
                     required />
              <p class="px-1 text-[11px] text-gray-400">초 분 시 일 월 요일 (6자리)</p>
            </div>

            <div class="flex flex-col gap-2">
              <label for="edit-description"
                     class="px-1 text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-zinc-500">
                작업 설명 (Description)
              </label>
              <textarea id="edit-description" name="description" rows="3" th:text="${detail.description}"
                        class="w-full resize-none rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-xs sm:text-sm outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 dark:border-zinc-800 dark:bg-zinc-800 dark:text-zinc-300"></textarea>
            </div>

            <div class="flex items-center justify-between rounded-xl bg-gray-50 p-4 dark:bg-zinc-800">
              <div class="flex flex-col gap-2">
                <span class="text-xs sm:text-sm font-bold text-gray-700 dark:text-zinc-200">스케줄러 활성화</span>
                <span class="text-xs text-gray-400">비활성화 시 스케줄이 중단됩니다.</span>
              </div>
              <label class="relative inline-flex cursor-pointer items-center">
                <input type="checkbox" name="enabled" class="peer sr-only" th:checked="${detail.enabled}">
                <div
                  class="peer h-6 w-11 rounded-full bg-gray-300 after:absolute after:left-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-blue-600 peer-checked:after:translate-x-full peer-checked:after:border-white peer-focus:outline-none dark:bg-zinc-700"></div>
              </label>
            </div>
          </div>

          <div class="mt-4 flex items-center justify-end gap-3 border-t pt-6 dark:border-zinc-800">
            <button type="button"
                    class="flex items-center gap-2 rounded-lg bg-blue-600 px-6 py-2.5 text-sm font-bold text-white shadow-lg shadow-blue-500/30 transition-all hover:bg-blue-700"
                    data-action="updateScheduler">
              <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M5 13l4 4L19 7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              변경사항 저장
            </button>
            <button type="button"
                    class="rounded-lg bg-gray-100 px-5 py-2.5 text-sm font-bold text-gray-700 transition-all hover:bg-gray-200 dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700"
                    data-mode="detail" data-action="toggleView">
              취소
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
