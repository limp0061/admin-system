<div
  th:fragment="auditHeader"
  id="page-header"
  class="flex flex-col md:flex-row md:items-center md:justify-end gap-3 px-5 py-3"
>
  <div class="flex items-center gap-2">
    <div
      class="flex items-center gap-2 text-gray-500 dark:text-slate-50"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="size-6"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M6.75 2.994v2.25m10.5-2.25v2.25m-14.252 13.5V7.491a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v11.251m-18 0a2.25 2.25 0 0 0 2.25 2.25h13.5a2.25 2.25 0 0 0 2.25-2.25m-18 0v-7.5a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v7.5m-6.75-6h2.25m-9 2.25h4.5m.002-2.25h.005v.006H12v-.006Zm-.001 4.5h.006v.006h-.006v-.005Zm-2.25.001h.005v.006H9.75v-.006Zm-2.25 0h.005v.005h-.006v-.005Zm6.75-2.247h.005v.005h-.005v-.005Zm0 2.247h.006v.006h-.006v-.006Zm2.25-2.248h.006V15H16.5v-.005Z"
        />
      </svg>
      <span
        class="hidden md:inline-flex h-10 items-center whitespace-nowrap text-sm font-medium"
      >
      검색 기간 설정
    </span>
    </div>
    <div class="relative w-40">
      <input
        name="startAt"
        id="startAt"
        type="text"
        placeholder="시작 기간을 선택해주세요."
        class="w-full rounded border px-2.5 py-1.5 text-sm hover:bg-gray-50 focus:border-gray-400 focus:outline-none focus:ring-0 dark:border-zinc-700 dark:bg-zinc-800"
        th:value="${#temporals.format(params.startAt, 'yyyy-MM-dd')}"
      />
    </div>
    <span class="shrink-0 text-gray-400">~</span>
    <div class="relative w-40">
      <input
        name="endAt"
        id="endAt"
        type="text"
        placeholder="종료 기간을 선택해주세요."
        class="w-full rounded border px-2.5 py-1.5 text-sm hover:bg-gray-50 focus:border-gray-400 focus:outline-none focus:ring-0 dark:border-zinc-700 dark:bg-zinc-800"
        th:value="${#temporals.format(params.endAt, 'yyyy-MM-dd')}"
      />
    </div>
  </div>
  <div class="flex items-center gap-2">
    <div
      class="relative inline-block"
      th:with="selectedTarget=${params?.targetEntity}"
    >
      <input
        type="hidden"
        name="targetEntity"
        id="targetEntity"
        th:value="${selectedTarget?.name() ?: ''}"
      />
      <button
        class="btn ignore-close flex min-w-28 items-center justify-between gap-1 whitespace-nowrap rounded border border-gray-300 px-3 py-2 text-sm hover:bg-gray-50 dark:border-zinc-700 dark:text-slate-50 dark:hover:bg-zinc-800/30"
        data-action="btnDropDown"
        id="labelTarget"
      >
        <span
          th:text="${selectedTarget != null ? selectedTarget.label : '대상 전체'}"
        ></span>
        <svg
          class="ml-2 h-3 w-3 opacity-50"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <div
        class="btn-dropDown absolute top-full z-50 mt-1 hidden min-w-full flex-col rounded border border-gray-200 bg-white shadow-md dark:border-zinc-700 dark:bg-zinc-800"
      >
        <button
          class="btn flex w-full cursor-pointer items-center justify-center whitespace-nowrap rounded border border-gray-100 bg-gray-50 px-4 py-2 text-sm transition-colors hover:bg-gray-100 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white"
          data-action="selectData"
          data-mode=""
        >
          대상 전체
        </button>
        <button
          class="btn flex w-full cursor-pointer items-center justify-center whitespace-nowrap rounded border border-gray-100 bg-gray-50 px-4 py-2 text-sm transition-colors hover:bg-gray-100 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white"
          data-action="selectData"
          th:data-mode="${target.name()}"
          th:each="target: ${targets}"
          th:text="${target.label}"
        ></button>
      </div>
    </div>
    <div
      class="relative inline-block"
      th:with="selectedAction=${params?.action}"
    >
      <input
        type="hidden"
        name="action"
        id="action"
        th:value="${selectedAction?.name() ?: ''}"
      />
      <button
        class="btn ignore-close flex min-w-28 items-center justify-between gap-1 whitespace-nowrap rounded border border-gray-300 px-3 py-2 text-sm hover:bg-gray-50 dark:border-zinc-700 dark:text-slate-50 dark:hover:bg-zinc-800/30"
        data-action="btnDropDown"
        id="labelAction"
      >
        <span
          th:text="${selectedAction != null ? selectedAction.label : '액션 전체'}"
        ></span>
        <svg
          class="ml-2 h-3 w-3 opacity-50"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </button>

      <div
        class="btn-dropDown absolute top-full z-50 mt-1 hidden min-w-full flex-col rounded border border-gray-200 bg-white shadow-md dark:border-zinc-700 dark:bg-zinc-800"
      >
        <button
          class="btn flex w-full cursor-pointer items-center justify-center whitespace-nowrap rounded border border-gray-100 bg-gray-50 px-4 py-2 text-sm transition-colors hover:bg-gray-100 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white"
          data-action="selectData"
          data-mode=""
        >
          액션 전체
        </button>
        <button
          class="btn flex w-full cursor-pointer items-center justify-center whitespace-nowrap rounded border border-gray-100 bg-gray-50 px-4 py-2 text-sm transition-colors hover:bg-gray-100 dark:border-transparent dark:bg-zinc-800 dark:text-zinc-300 dark:hover:bg-zinc-700 dark:hover:text-white"
          data-action="selectData"
          th:data-mode="${action.name()}"
          th:each="action: ${actions}"
          th:text="${action.label}"
        ></button>
      </div>
    </div>
    <button
      type="button"
      class="btn btn-primary w-24 justify-center"
      data-action="search"
    >
      조회
    </button>
    <button
      type="button"
      class="btn btn-danger w-24 justify-center"
      data-action="clear"
    >
      초기화
    </button>
  </div>
  <div th:replace="~{components/view-controller::viewController}"></div>
</div>
