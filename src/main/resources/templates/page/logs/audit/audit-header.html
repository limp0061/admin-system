<div th:fragment="auditHeader" id="page-header" class="flex items-center justify-end gap-2 px-7 py-3">
    <div class="shrink-0 text-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
             stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.75 2.994v2.25m10.5-2.25v2.25m-14.252 13.5V7.491a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v11.251m-18 0a2.25 2.25 0 0 0 2.25 2.25h13.5a2.25 2.25 0 0 0 2.25-2.25m-18 0v-7.5a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v7.5m-6.75-6h2.25m-9 2.25h4.5m.002-2.25h.005v.006H12v-.006Zm-.001 4.5h.006v.006h-.006v-.005Zm-2.25.001h.005v.006H9.75v-.006Zm-2.25 0h.005v.005h-.006v-.005Zm6.75-2.247h.005v.005h-.005v-.005Zm0 2.247h.006v.006h-.006v-.006Zm2.25-2.248h.006V15H16.5v-.005Z"/>
        </svg>
    </div>
    <span class="text-sm font-medium text-gray-600 border-b whitespace-nowrap inline-flex items-center h-10">
        검색 기간 설정
    </span>
    <div class="flex items-center gap-2">
        <div class="relative w-40">
            <input name="startAt" id="startAt" type="text"
                   placeholder="시작 기간을 선택해주세요."
                   class="w-full border rounded px-3 py-2 text-sm focus:border-gray-400 focus:ring-0 hover:bg-gray-50 focus:outline-none"
                   th:value="${#temporals.format(params.startAt, 'yyyy-MM-dd')}"
            />
        </div>
        <span class="text-gray-400 shrink-0"> ~ </span>
        <div class="relative w-40">
            <input name="endAt" id="endAt" type="text"
                   placeholder="종료 기간을 선택해주세요."
                   class="w-full border rounded px-3 py-2 text-sm focus:border-gray-400 focus:ring-0 hover:bg-gray-50 focus:outline-none"
                   th:value="${#temporals.format(params.endAt, 'yyyy-MM-dd')}"
            />
        </div>
        <div class="relative inline-block" th:with="selectedTarget=${params?.targetEntity}">
            <input type="hidden" name="targetEntity" id="targetEntity" th:value="${selectedTarget?.name() ?: ''}">
            <button class="btn flex items-center justify-between gap-1 border border-gray-300 rounded min-w-28 px-3 py-2 text-sm hover:bg-gray-50 whitespace-nowrap ignore-close"
                    data-action="btnDropDown"
                    id="labelTarget">
                <span th:text="${selectedTarget != null ? selectedTarget.label : '대상 전체'}"></span>
                <svg class="ml-2 w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <div class="btn-dropDown absolute z-50 flex-col top-full mt-1 bg-white border border-gray-200 rounded shadow-md min-w-full hidden">
                <button class="btn flex items-center justify-center w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded text-sm hover:bg-gray-100 whitespace-nowrap transition-colors cursor-pointer"
                        data-action="selectData"
                        data-mode=""
                >대상 전체
                </button>
                <button class="btn flex items-center justify-center w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded text-sm hover:bg-gray-100 whitespace-nowrap transition-colors cursor-pointer"
                        data-action="selectData"
                        th:data-mode="${target.name()}"
                        th:each="target: ${targets}"
                        th:text="${target.label}"
                >
                </button>
            </div>
        </div>
        <div class="relative inline-block" th:with="selectedAction=${params?.action}">
            <input type="hidden" name="action" id="action" th:value="${selectedAction?.name() ?: ''}">
            <button class="btn flex items-center justify-between gap-1 border border-gray-300 rounded min-w-28 px-3 py-2 text-sm hover:bg-gray-50 whitespace-nowrap ignore-close"
                    data-action="btnDropDown"
                    id="labelAction">
                <span th:text="${selectedAction != null ? selectedAction.label : '액션 전체'}"></span>
                <svg class="ml-2 w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
            </button>

            <div class="btn-dropDown absolute z-50 flex-col top-full mt-1 bg-white border border-gray-200 rounded shadow-md min-w-full hidden">
                <button class="btn flex items-center justify-center w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded text-sm hover:bg-gray-100 whitespace-nowrap transition-colors cursor-pointer"
                        data-action="selectData"
                        data-mode=""
                >액션 전체
                </button>
                <button class="btn flex items-center justify-center w-full px-4 py-2 border border-gray-100 bg-gray-50 rounded text-sm hover:bg-gray-100 whitespace-nowrap transition-colors cursor-pointer"
                        data-action="selectData"
                        th:data-mode="${action.name()}"
                        th:each="action: ${actions}"
                        th:text="${action.label}"
                >
                </button>
            </div>
        </div>
        <button type="button" class="btn btn-primary w-24 justify-center" data-action="search">조회</button>
        <button type="button" class="btn btn-danger w-24 justify-center" data-action="clear">초기화</button>
    </div>
    <div th:replace="~{components/view-controller::viewController}"></div>
</div>
