<div
  th:fragment="historyHeader"
  class="flex flex-col-reverse flex-wrap xl:flex-row w-full xl:items-end xl:justify-between">

  <div>
    <input type="hidden" id="tabType" th:value="${currentMenu}" />
    <ul class="flex text-xs md:text-sm font-medium">
      <li class="whitespace-nowrap border-l border-t pr-1 dark:border-zinc-800">
        <a
          href="javascript:void(0)"
          th:classappend="${currentMenu == 'login'} ? 'text-blue-600 border-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent'"
          class="inline-block rounded-t-lg border-b-2 p-4"
          data-action="switchTab"
          data-url="/logs/history/login"
        >
          로그인 기록
        </a>
      </li>
      <li class="whitespace-nowrap border-l border-t pr-1 dark:border-zinc-800">
        <a
          href="javascript:void(0)"
          th:classappend="${currentMenu == 'password'} ? 'text-blue-600 border-blue-600 dark:text-blue-400 dark:border-blue-400' : 'border-transparent'"
          class="inline-block rounded-t-lg border-b-2 p-4"
          data-action="switchTab"
          data-url="/logs/history/password"
        >
          비밀번호 변경 기록
        </a>
      </li>
    </ul>
  </div>

  <div class="flex flex-col xl:flex-row xl:items-center xl:justify-end gap-3 py-3">
    <div class="flex w-full items-center gap-2 lg:w-auto shrink-0">
      <div class="hidden sm:flex items-center gap-2 text-gray-500 dark:text-slate-50 shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.75 2.994v2.25m10.5-2.25v2.25m-14.252 13.5V7.491a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v11.251m-18 0a2.25 2.25 0 0 0 2.25 2.25h13.5a2.25 2.25 0 0 0 2.25-2.25m-18 0v-7.5a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v7.5m-6.75-6h2.25m-9 2.25h4.5m.002-2.25h.005v.006H12v-.006Zm-.001 4.5h.006v.006h-.006v-.005Zm-2.25.001h.005v.006H9.75v-.006Zm-2.25 0h.005v.005h-.006v-.005Zm6.75-2.247h.005v.005h-.005v-.005Zm0 2.247h.006v.006h-.006v-.006Zm2.25-2.248h.006V15H16.5v-.005Z" />
        </svg>
        <span class="hidden md:inline text-sm font-medium">검색 기간 설정</span>
      </div>
      <div class="flex-1 lg:w-40">
        <input name="startAt" id="startAt" type="text" placeholder="시작 기간"
               class="w-full rounded border px-2.5 py-1.5 text-sm hover:bg-gray-50 dark:border-zinc-700 dark:bg-zinc-800"
               th:value="${#temporals.format(params.startAt, 'yyyy-MM-dd')}" />
      </div>
      <span class="shrink-0 text-gray-400">~</span>
      <div class="flex-1 lg:w-40">
        <input name="endAt" id="endAt" type="text" placeholder="종료 기간"
               class="w-full rounded border px-2.5 py-1.5 text-sm hover:bg-gray-50 dark:border-zinc-700 dark:bg-zinc-800"
               th:value="${#temporals.format(params.endAt, 'yyyy-MM-dd')}" />
      </div>
    </div>
    <div class="search-container flex flex-wrap gap-2 lg:justify-end">
      <div class="flex w-full items-center gap-2 md:flex-1 lg:w-auto">
        <form class="relative inline-block flex-1">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="absolute left-3 top-1/2 h-3 w-3 -translate-y-1/2 text-gray-400"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
            />
          </svg>
          <input
            type="text"
            id="emailId"
            name="emailId"
            placeholder="이메일"
            th:value="${params.emailId}"
            class="search-input h-9 w-full xl:w-64 rounded-md border border-gray-300 py-3 pl-10 pr-4 text-xs font-medium focus:outline-none focus:ring-1 focus:ring-gray-300"
            autocomplete="off"
          />
        </form>
      </div>
      <div class="flex w-full items-center gap-2 md:flex-1 lg:w-auto">
        <button
          type="button"
          class="btn btn-primary h-10 flex-1 justify-center rounded border text-xs sm:text-sm"
          data-action="search"
        >
          조회
        </button>
        <button
          type="button"
          class="btn btn-danger h-10 flex-1 justify-center rounded border text-xs sm:text-sm"
          data-action="clear"
        >
          초기화
        </button>

      </div>
      <div th:replace="~{components/view-controller::viewController}"></div>
    </div>
  </div>
</div>
