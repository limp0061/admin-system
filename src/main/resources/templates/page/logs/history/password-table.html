<div th:fragment="passwordHistoryTable" id="page-table" class="w-full flex-1">
  <table class="table w-full">
    <thead class="border border-b-2">
    <tr>
      <th class="min-w-0 flex-1">이메일</th>
      <th class="w-[15%]">접속 IP</th>
      <th class="w-[15%]">변경 유형</th>
      <th class="w-[20%]">
        <div class="flex items-center justify-between gap-2">
          <span>일시</span>
          <button
            type="button"
            class="sort-btn rounded p-1 hover:bg-gray-100"
            data-action="sort"
            data-sort="updatedAt"
            th:data-order="${list.direction}"
            aria-label="정렬"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="inline-block h-4 w-4 transform transition-transform duration-200"
              th:classappend="${list.sortBy == 'createdAt' and list.direction == 'ASC'} ? 'rotate-180' : ''"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m19.5 8.25-7.5 7.5-7.5-7.5"
              />
            </svg>
          </button>
        </div>
      </th>
    </tr>
    </thead>
    <tbody class="divide-y dark:divide-zinc-800">
    <tr th:if="${#lists.isEmpty(list.content)}">
      <td colspan="4" class="py-16 text-center text-gray-400">
        해당 기간에 비밀번호 변경 이력이 없습니다.
      </td>
    </tr>
    <tr
      th:unless="${#lists.isEmpty(list.content)}"
      th:each="item : ${list.content}"
    >
      <td th:text="${item.emailId}"></td>
      <td th:text="${item.clientIp}"></td>
      <td th:text="${item.changeType.label}"></td>
      <td
        th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}"
      ></td>
    </tr>
    </tbody>
  </table>
</div>
