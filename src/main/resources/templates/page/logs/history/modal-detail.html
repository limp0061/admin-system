<div th:fragment="content" class="modal-form w-[650px] max-h-[80vh] z-10 bg-white p-6 rounded-2xl shadow-xl">
    <div class="shrink-0 flex items-center justify-between border-b pb-4">
        <span class="text-xl font-bold text-slate-800">로그인 정보</span>
        <button onClick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                 stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>


    <div class="shrink-0 flex flex-col gap-2 text-sm text-slate-600 border border-slate-200 rounded-md p-2">
        <div class="flex justify-between p-2">
            <span class="font-semibold text-slate-400 ">이메일</span>
            <span th:text="${loginHistory.emailId}"></span>
        </div>
        <div class="flex justify-between p-2">
            <span class="font-semibold text-slate-400">일시</span>
            <span th:text="${#temporals.format(loginHistory.createdAt,'yyyy-MM-dd HH:mm')}"></span>
        </div>
        <div class="flex justify-between p-2">
            <span class="font-semibold text-slate-400">접속 IP</span>
            <span th:text="${loginHistory.rawIp}"></span>
        </div>
        <div class="flex justify-between p-2">
            <span class="font-semibold text-slate-400">모델 명</span>
            <span th:text="${loginHistory.deviceName}"></span>
        </div>
        <div class="flex flex-col items-start gap-2 p-2">
            <span class="font-semibold text-slate-400">UserAgent</span>
            <span th:text="${loginHistory.userAgent}"></span>
        </div>
        <div class="flex flex-col items-start gap-2 p-2" th:if="${loginHistory.failureReason}">
            <span class="font-semibold text-slate-400">원인</span>
            <span th:text="${loginHistory.failureReason}"></span>
        </div>
    </div>
    <div class="shrink-0 flex justify-end gap-2 pt-4 border-t">
        <button type="button" onClick="closeModal()" class="btn bg-gray-100 px-4">
            닫기
        </button>
    </div>
</div>
