<div th:fragment="content" class="fixed inset-0 flex items-center justify-center bg-black/50">
  <div class="modal-form max-w-[450px] mx-4">
    <div class="p-2 text-center">
      <div
        class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-red-50"
      >
        <svg
          class="h-8 w-8 text-red-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
      </div>
      <p class="text-sm leading-relaxed text-gray-500">
      <span
        class="text-gray-700 dark:text-slate-200"
        th:utext="${result.message}"
      ></span>
      </p>
    </div>
    <div class="btn-list flex justify-end gap-3">
      <button
        th:if="${result.isDeletable}"
        type="button"
        data-action="deleteDept"
        th:data-key="${dept.id}"
        class="btn btn-danger"
      >
        삭제
      </button>
      <button
        type="button"
        onClick="closeModal()"
        class="btn px-4 dark:bg-zinc-300 dark:hover:bg-zinc-400"
      >
        닫기
      </button>
    </div>
  </div>
</div>
